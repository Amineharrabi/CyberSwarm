#!/usr/sbin/nft -f
# Base firewall for the gateway. Default-forward is ACCEPT so the lab works out of the
# box; Blue tightens this at runtime by inserting drop rules (block_ip / rate_limit tools).
#
# Segmentation intent (documented for the report):
#   - attacker_net may reach the dmz webapp only (not the db directly).
#   - internal_net (db) is reachable only from the dmz.
#   - nothing reaches the internet (enforced by Docker internal:true networks).

flush ruleset

table ip filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        # established/related first so return traffic is never blocked by Blue's rules
        ct state established,related accept

        # --- Segmentation policy ---
        # attacker_net -> db (internal_net) is forbidden: Red must pivot through the webapp
        ip saddr 10.10.1.0/24 ip daddr 10.10.3.0/24 drop

        # Blue inserts per-IP drops ABOVE this comment at runtime, e.g.:
        #   nft insert rule ip filter forward ip saddr 10.10.1.50 drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
