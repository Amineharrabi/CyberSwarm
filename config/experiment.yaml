# CyberSwarm experiment configuration
# One file drives a whole run. Change the learning flags to reproduce the ablation (E2).

run_name: baseline        # becomes runs/<run_name>/ ...
rounds: 5                 # 2-night target; bump to 15 if you have machine time
seed: 42

budgets:
  red_steps: 8           # start tiny (5) while debugging prompts, then raise
  blue_steps: 8
  round_timeout_s: 600

llm:
  # OpenAI-compatible endpoint. Ollama default shown; vLLM uses :8000/v1.
  base_url: http://localhost:11434/v1
  api_key: ollama        # Ollama ignores the value but the OpenAI client needs one
  planner: qwen3:14b     # drives Red and Blue (needs tool calling)
  reflector: qwen3:14b   # swap to fdtn-ai/Foundation-Sec-1.1-8B for the oral talking point
  temperature: 0.3
  request_timeout_s: 120

learning:
  reflection: true       # end-of-round lesson extraction -> playbook
  memory: true           # inject playbook + last N episode summaries
  debrief: true          # each side sees the other's log before reflecting
  memory_window: 3       # how many past episodes to inject

blue:
  use_ids_model: false   # ML layer is cut for the 2-night build; Suricata alerts are Blue's perception
  allow_code_patches: true

lab:
  subnets:
    attacker_net: 10.10.1.0/24
    dmz_net: 10.10.2.0/24
    internal_net: 10.10.3.0/24
  gateway_host: ".254"
  log_dir: lab/logs      # Suricata eve.json lands here, mounted into the gateway
